# Publishes the web app to GitHub Pages. Inert until you switch it on:
#   1. Settings > Pages > Source: GitHub Actions.
#   2. Settings > Secrets and variables > Actions > Variables: add ENABLE_PAGES = true.
# Until then every run of this workflow is skipped. The site is served from /<repository name>/,
# so VITE_BASE is taken from the repository name and survives a rename.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      # The real-league file must never be part of a build that gets uploaded.
      - run: test ! -e apps/web/dist/private
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
